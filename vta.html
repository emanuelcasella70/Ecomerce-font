<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="vta.css">
    <title>Document</title>
</head>
<body>
    <div class="conteiner">
        <div class="div-container">
            <div class="conteiner-datos-envio">
                    <div>
                        <h2>Datos De Envio 📦</h2>
                    </div>        
                <div>
                    <form action="">
                        <label for="name">Nombre Completo</label><br>
                        <input type="text" name=""id="name" placeholder="Nombre y Apellido"><br>
                        <label for="nameAut">Nombres De Personas Autorizadas a Recibir el Pedido</label><br>
                        <input type="text" name="" id="nameAut"><br>
                        <label for="nContact">Numero De Contacto</label><br> 
                        <input type="number" id="nContact"><br>
                        <label for="lcda">Localidad</label><br>
                        <input type="lcda" id="lcda"><br>
                        <label for="dc" id="dc">Calle y Direccion</label><br>
                        <input type="text"id="dc"><br>
                        <label for="etcalle">Entre Calles</label><br>
                        <input type="text" id="etcalle"><br>
                        <label for="casa">Casa</label>
                        <input type="checkbox" id="casa"><br>
                        <label for="dptm">Departamento</label>
                        <input type="checkbox" id="dptm"><br>
                        <label for="ph">ph</label>
                        <input type="checkbox">
                    </form>
                </div>
            </div>
            <div class="conteiner-metodos-depago">
                <div>
                <h2>Metodo De Pago 💳</h2>
                </div>
                <div>
                    <h3>Seleccionar Metodo de Pago</h3>
                    <form action="" class="formulario">
                        <input type="radio" name="name"id="Credito-debito">
                        <label for="Credito-debito">Tarjeta de Credito/Debito</label><br>
                        <input type="radio"id="mp"name="name">
                        <label for="mp">Mercado Pago</label>
                        <div class="div-tjt">
                            <img src="./fots/Mochila DALHILA.jpg" alt="" class="tjt">
                        </div>
                        <div class="div-container-butt">
                            <button type="button"class="butt btn-siguiente">Siguiente</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>    
    <!-- <script src="./carrito.js"></script> -->
    <script src="./vta.js"></script>
</body>
</html>
